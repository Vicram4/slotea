spring:
  application:
    name: slotea-api
  # En local, las credenciales salen del .env de la raíz del repo (ignorado por Git).
  # En producción se inyectan como variables de entorno (DB_URL, DB_USER, DB_PASSWORD).
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:slotea}}
    username: ${DB_USER:${POSTGRES_USER:slotea}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # el esquema lo gestiona solo Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  # En local, Mailpit (docker compose): captura los emails, interfaz en http://localhost:8025.
  # En producción, Brevo (ver application-prod.yaml).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:${MAILPIT_SMTP_PORT:1025}}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # El envío inmediato va dentro de la petición de reserva: un SMTP lento no puede colgarla.
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
      # Sin estas dos, JavaMail busca el nombre canónico de la máquina en el DNS (para el EHLO y para
      # el Message-ID): en algunos equipos tarda más de 10 s por envío. Brevo autentica por usuario.
      "[mail.smtp.localhost]": localhost
      "[mail.from]": ${app.mail.from}
  thymeleaf:
    # Solo hay plantillas de email: ni vistas web ni caché de desarrollo que vigilar.
    check-template-location: false

server:
  port: ${PORT:8080}

app:
  auth:
    # Clave HS256 en Base64 (≥ 32 bytes). Sin ella la API no arranca. Ver .env.example.
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  links:
    # Clave HMAC de los enlaces de gestión de citas (Base64, ≥ 32 bytes). Ver .env.example.
    secret: ${LINK_SECRET:}
    # Web pública a la que apuntan los enlaces de los emails.
    web-url: ${APP_WEB_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:Slotea <reservas@slotea.test>}
  jobs:
    # Token del cron que llama a /internal/jobs/* (≥ 32 caracteres). Vacío = esos endpoints dan 401.
    token: ${JOBS_TOKEN:}

springdoc:
  # Orden estable: el OpenAPI se guarda como contrato (apps/web/openapi.json) y se compara en CI.
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  swagger-ui:
    # Swagger UI lee la cookie XSRF-TOKEN y envía la cabecera: se puede probar el login desde ahí.
    csrf:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      # Un SMTP caído o lento no es una API caída: la outbox guarda los emails y los reintenta.
      # Si contara, Cloud Run y la prueba de humo darían por muerta una API que funciona.
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
