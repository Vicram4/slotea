spring:
  application:
    name: slotea-api
  # En local, las credenciales salen del .env de la raíz del repo (ignorado por Git).
  # En producción se inyectan como variables de entorno (DB_URL, DB_USER, DB_PASSWORD).
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:slotea}}
    username: ${DB_USER:${POSTGRES_USER:slotea}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # el esquema lo gestiona solo Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

app:
  auth:
    # Clave HS256 en Base64 (≥ 32 bytes). Sin ella la API no arranca. Ver .env.example.
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d

springdoc:
  # Orden estable: el OpenAPI se guarda como contrato (apps/web/openapi.json) y se compara en CI.
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  swagger-ui:
    # Swagger UI lee la cookie XSRF-TOKEN y envía la cabecera: se puede probar el login desde ahí.
    csrf:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
