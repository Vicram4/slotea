name: Smoke test (production)

# Comprueba cada día que producción responde. Si falla, GitHub avisa por email.
# Nota: GitHub desactiva los cron tras 60 días sin actividad en el repo.
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC (minuto no redondo: menos cola en GitHub)
  workflow_dispatch:

permissions:
  contents: read

env:
  WEB_URL: https://slotea.vercel.app
  API_URL: https://slotea-api-908024172167.europe-west1.run.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # --retry cubre el arranque en frío (Cloud Run y Neon escalan a cero).
      - name: Web responde
        run: curl -fsS --retry 3 --retry-all-errors --max-time 30 -o /dev/null "$WEB_URL/"

      - name: API con base de datos (Cloud Run directo)
        run: curl -fsS --retry 3 --retry-all-errors --max-time 30 "$API_URL/actuator/health" | grep -q '"status":"UP"'

      - name: Proxy de Vercel hasta la API
        run: curl -fsS --retry 3 --retry-all-errors --max-time 30 "$WEB_URL/api/v1/ping" | grep -q '"status":"ok"'
